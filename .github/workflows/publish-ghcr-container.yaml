name: Publish multiarch images on ghcr.io
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to dev-<short-sha> for manual runs)'
        required: false
        default: ''
      run_tests:
        description: 'Run test_spilo.sh on natively-built arches'
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Derive image name and tag
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.image.outputs.IMAGE }}
      tag: ${{ steps.image.outputs.TAG }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Derive spilo image name and tag
      id: image
      working-directory: postgres-appliance
      run: |
        PGVERSION=$(sed -n 's/^ARG PGVERSION=\([1-9][0-9]*\).*$/\1/p' Dockerfile)
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="dev-${GITHUB_SHA::8}"
        fi
        echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$PGVERSION" >> $GITHUB_OUTPUT
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: 'read'
      packages: 'write'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-22.04
            native: true
            qemu: false
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-22.04
            native: false
            qemu: true
          - platform: linux/s390x
            arch: s390x
            runner: [self-hosted, s390x]
            native: true
            qemu: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      if: ${{ matrix.qemu }}
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # For natively-built arches: build into the local docker daemon and run the
    # spilo test suite before pushing. buildx caches the result, so the push
    # build below reuses the layers and is effectively free.
    - name: Build and load for testing
      if: ${{ matrix.native && (github.event.inputs.run_tests != 'false') }}
      uses: docker/build-push-action@v6
      with:
        context: "postgres-appliance/"
        load: true
        platforms: ${{ matrix.platform }}
        tags: "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}-test"

    - name: Test spilo docker image
      if: ${{ matrix.native && (github.event.inputs.run_tests != 'false') }}
      env:
        SPILO_TEST_IMAGE: "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}-test"
      run: |
        bash postgres-appliance/tests/test_spilo.sh

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: "postgres-appliance/"
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Merge multiarch manifest
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digest-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push manifest list
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}" \
          $(printf '${{ needs.prepare.outputs.image }}@sha256:%s ' *)

    - name: Inspect manifest
      run: |
        docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}"
